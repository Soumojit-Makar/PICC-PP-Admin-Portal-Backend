# ==============================================================================
# PICC-PP-Admin-Portal-Backend - Application Configuration
# ==============================================================================

# Server Configuration
server.port=${SERVER_PORT:8080}
spring.application.name=env-dashboard-configurator

# Active Profile (Override via SPRING_PROFILES_ACTIVE=dev | main | local)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:main}

# Spring Cloud Config Label
spring.cloud.config.label=${CONFIG_LABEL:v1}

# Optional Centralized Spring Cloud Config Server
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}/nnp-config

# ------------------------------------------------------------------------------
# Swagger / OpenAPI Documentation
# ------------------------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.display-request-duration=true
springdoc.show-actuator=true

# ------------------------------------------------------------------------------
# Actuator & Observability
# ------------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.env.show-values=NEVER
management.endpoint.configprops.show-values=NEVER

# ------------------------------------------------------------------------------
# Logging
# ------------------------------------------------------------------------------
logging.level.com.nnp.dashboard=${LOG_LEVEL:INFO}
