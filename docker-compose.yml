services:
  admin-portal-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: picc-pp-admin-portal-backend:latest
    container_name: admin-portal-backend
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      - SERVER_PORT=${SERVER_PORT:-8080}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-main}
      - CONFIG_SERVER_URL=${CONFIG_SERVER_URL:-http://localhost:8888}
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/nnp_dashboard}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:-postgres}
      - SPRING_ACTIVEMQ_BROKER_URL=${SPRING_ACTIVEMQ_BROKER_URL:-tcp://artemis:61616}
      - SPRING_ACTIVEMQ_USER=${SPRING_ACTIVEMQ_USER:-artemis}
      - SPRING_ACTIVEMQ_PASSWORD=${SPRING_ACTIVEMQ_PASSWORD:-artemis}
      - KEYCLOAK_SERVICE_BASEURL=${KEYCLOAK_SERVICE_BASEURL:-http://localhost:8080}
      - HAPROXY_SERVICE_BASEURL=${HAPROXY_SERVICE_BASEURL:-http://localhost:8081}
      - GITLAB_SERVICE_BASEURL=${GITLAB_SERVICE_BASEURL:-http://localhost:8089}
      - REDMINE_SERVICE_BASEURL=${REDMINE_SERVICE_BASEURL:-http://localhost:3000}
      - MAIL_SERVICE_BASEURL=${MAIL_SERVICE_BASEURL:-http://localhost:8085}
      - K8S_API_URL=${K8S_API_URL:-https://kubernetes.default.svc}
      - HAPROXY_BASE_DOMAIN=${HAPROXY_BASE_DOMAIN:-nnp.example.com}
      - APP_CORS_ALLOWED_ORIGINS=${APP_CORS_ALLOWED_ORIGINS:-*}
    depends_on:
      postgres:
        condition: service_healthy
      artemis:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    container_name: admin-portal-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nnp_dashboard}
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${SPRING_DATASOURCE_USERNAME:-postgres}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  artemis:
    image: apache/activemq-artemis:latest-alpine
    container_name: admin-portal-artemis
    environment:
      ARTEMIS_USER: ${SPRING_ACTIVEMQ_USER:-artemis}
      ARTEMIS_PASSWORD: ${SPRING_ACTIVEMQ_PASSWORD:-artemis}
    ports:
      - "${ACTIVEMQ_PORT:-61616}:61616"
      - "${ACTIVEMQ_CONSOLE_PORT:-8161}:8161"
    volumes:
      - artemis-data:/var/lib/artemis-instance/data
    restart: unless-stopped

volumes:
  postgres-data:
  artemis-data:
